name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mahdiebene&show_icons=true&include_all_commits=true&rank_icon=github&bg_color=101510&title_color=C4F56A&icon_color=C4F56A&text_color=F1F5EB&border_color=2A3426&custom_title=GitHub%20stats&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mahdiebene&layout=compact&langs_count=8&bg_color=101510&title_color=C4F56A&text_color=F1F5EB&border_color=2A3426&custom_title=Most%20used%20languages&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mahdiebene
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            profile/snake-light.svg?palette=github-light&color_snake=#101510
            profile/snake-dark.svg?color_snake=#F1F5EB&color_dots=#1A221A,#2E4A22,#4F7A2C,#84B83C,#C4F56A

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "Refresh profile cards"
          git pull --rebase origin main
          git push origin main