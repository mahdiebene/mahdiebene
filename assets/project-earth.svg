<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Project Earth — small steps, shared impact</title>
  <desc id="desc">An original illustration of a globe, a growing leaf, and orbital paths, in teal on graphite. Not a product screenshot.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#283D39" /></pattern>
    <radialGradient id="glow"><stop stop-color="#7EDBC4" stop-opacity=".13" /><stop offset="1" stop-color="#7EDBC4" stop-opacity="0" /></radialGradient>
    <clipPath id="bounds"><rect width="640" height="240" rx="14" /></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="640" height="240" fill="#121E1B" />
    <rect x="340" width="300" height="240" fill="url(#grid)" />
    <circle cx="498" cy="115" r="164" fill="url(#glow)" />
    <path d="M28 1H188" stroke="#7EDBC4" stroke-width="2" />
    <g font-family="'Segoe UI', Arial, sans-serif">
      <text x="28" y="39" fill="#7EDBC4" font-family="Consolas, monospace" font-size="12" letter-spacing="2">04 / COMMUNITY &amp; CLIMATE</text>
      <text x="28" y="107" fill="#ECF7F2" font-size="36" font-weight="700" letter-spacing="-1">Small steps.</text>
      <text x="28" y="148" fill="#ECF7F2" font-size="36" font-weight="700" letter-spacing="-1">Shared impact.</text>
      <text x="28" y="208" fill="#A2BCB3" font-family="Consolas, monospace" font-size="12" letter-spacing="1">THE WEB HOME OF EARTH'S ANTS</text>
    </g>
    <g transform="translate(495 125)">
