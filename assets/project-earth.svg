      <ellipse rx="100" ry="35" transform="rotate(-29)" stroke="#7EDBC4" stroke-opacity=".65" stroke-width="1.5" />
      <path d="M9-43C5-74 20-90 59-91C58-56 41-35 9-43Z" fill="#244D3C" stroke="#7EDBC4" stroke-width="2" />
