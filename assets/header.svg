<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Mahdi Ebene Mahmud — frontend developer, CSE student, and competitive programmer.</title>
  <desc id="desc">A compact graphite and lime personal banner with a geometric M, orbital paths, and a dot grid. Based in Dhaka, Bangladesh. Always learning.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#303A30" />
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#C4F56A" stop-opacity=".12" />
      <stop offset="1" stop-color="#C4F56A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="1152" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4F56A" />
      <stop offset="1" stop-color="#C4F56A" stop-opacity="0" />
    </linearGradient>
    <clipPath id="bounds"><rect width="1200" height="280" rx="20" /></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="280" fill="#101510" />
    <rect x="840" width="360" height="280" fill="url(#grid)" />
    <circle cx="1040" cy="148" r="210" fill="url(#glow)" />
    <path d="M48 1H1152" stroke="url(#accent)" stroke-width="2" />
    <g font-family="'Segoe UI', Arial, sans-serif">
      <g font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">
        <circle cx="55" cy="51" r="5" fill="#C4F56A" />
        <text x="72" y="56" fill="#DDE5D7">M4HDI / ALWAYS LEARNING</text>
      </g>
      <text x="48" y="134" fill="#F1F5EB" font-size="60" font-weight="700" letter-spacing="-2">Mahdi Ebene Mahmud</text>
      <text x="52" y="181" fill="#C4F56A" font-size="24">Frontend developer. CSE student. Competitive programmer.</text>
      <path d="M52 214H820" stroke="#2A3426" />
      <text x="52" y="247" fill="#ABB7A3" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1.5">DHAKA, BANGLADESH / EAST WEST UNIVERSITY</text>
    </g>
    <g transform="translate(1030 148) scale(.7)">
      <circle r="137" stroke="#34422C" />
      <circle r="105" stroke="#34422C" stroke-dasharray="3 9" />
      <ellipse rx="170" ry="61" transform="rotate(-35)" stroke="#658643" />
      <ellipse rx="170" ry="61" transform="rotate(35)" stroke="#34422C" />
      <path d="M-64 52V-52L0 15L64-52V52" stroke="#C4F56A" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" />
      <circle cx="112" cy="-79" r="7" fill="#C4F56A" />
      <circle cx="-112" cy="79" r="5" fill="#101510" stroke="#C4F56A" stroke-width="2" />
      <path d="M-7-137H7M0-144V-130M-7 137H7M0 130V144" stroke="#94A28C" />
    </g>
    <rect x=".5" y=".5" width="1199" height="279" rx="19.5" stroke="#2A3426" />
  </g>
</svg>